# =============================================================================
# Alembic Configuration for ShopManager OS Backend
# =============================================================================
# This file configures Alembic, the database migration tool for SQLAlchemy.
#
# Usage (run from d:\POS Softwrae\):
#   Generate migration:   alembic -c backend/alembic.ini revision --autogenerate -m "description"
#   Apply migrations:     alembic -c backend/alembic.ini upgrade head
#   Rollback one step:    alembic -c backend/alembic.ini downgrade -1
#   View current:         alembic -c backend/alembic.ini current
#   View history:         alembic -c backend/alembic.ini history
# =============================================================================

[alembic]
# Location of migration scripts, relative to this file
script_location = backend/migrations

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate long migration file names
truncate_slug_length = 40

# Database URL — overridden by env.py using the DATABASE_URL env variable.
# This fallback value is only used if env.py doesn't override it.
# The actual URL comes from the .env file via backend/config/settings.py.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/shopmanager


# =============================================================================
# Logging
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
